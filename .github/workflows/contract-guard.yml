# Convention: process/contracts.md §4–§5 (HK-5, HK-12, HK-13) — job name
# `contract-guard`, --check only. Vendored tools: tag + sha256 in .repin.toml.
# Layer 1 (coherence): contract_guard.py, strict — no --relax-tags: the pushed tag must
#   exist, unlike the mid-bump local hook — then repin --check with touch-the-family
#   against the push base.
# Layer 2 (owned-surface guards): check_esp32_site.py (esp32-site markers) +
#   check_docs_manifest.py (docs-manifest coherence, process/user-docs.md §4).
name: contract-guard

# HK-13 (contracts.md §4): NO path gate — every branch push and every PR. The owned
# artifact lives outside contracts/, and a hand-kept path list is one more copy of the
# edge that can rot (OPS-16). `branches: ["**"]` = all branches, not tag refs.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: TAG-MISSING / ORPHAN-TAG / CONTENT-DRIFT / STAMP-DRIFT read
          # tags and tag trees, and --touched diffs against the push base.
          fetch-depth: 0
      # PROD-25: never rely on fetch-tags (actions/checkout#1467) — fetch the tag refs
      # explicitly (run 29414821199 was the live proof on this repo).
      - name: Fetch tags
        run: git fetch --tags --force origin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "contract-guard --check (layer 1, strict)"
        run: python3 scripts/contract_guard.py --check
      # HK-12 §5 staleness: ADVISORY under the config's default_fail_on = "none" (the
      # recorded satellite carve-out until FW first light; the first release gate
      # raises it). HK-13 touch-the-family is NOT under the carve-out: --touched fails
      # a change that touches a pin folder or its conformance test while the pin trails
      # its owner (satellite's own offer; OPS-17). A first push of a new branch has no
      # base (all-zero sha) — repin then warns and skips the touch check.
      - name: "repin --check (staleness advisory, touch-the-family hard)"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 scripts/repin.py --check --touched "$BASE"
      - name: "esp32-site owner guard (layer 2)"
        run: python3 scripts/check_esp32_site.py
      - name: "docs-manifest coherence guard (layer 2)"
        run: python3 scripts/check_docs_manifest.py
